name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release
      - name: Publish portable exe and checksum
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/NHLOverlay/NHLOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o publish
          $hash = (Get-FileHash publish/NHLOverlay.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *NHLOverlay.exe" | Out-File -Encoding ascii -NoNewline publish/NHLOverlay.exe.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME publish/NHLOverlay.exe publish/NHLOverlay.exe.sha256 --title $env:GITHUB_REF_NAME --generate-notes
